[package]
name = "zoomthai-frontend"
version = "0.1.0"
edition = "2021"

[dependencies]
leptos = { version = "0.6.11", features = ["csr"] }
leptos_router = { version = "0.6", features = ["csr"] }
reqwasm = "0.5.0" 
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

gloo-net = "0.3"
urlencoding = "2.1.3"

console_error_panic_hook = "0.1"
wasm-bindgen = "0.2"