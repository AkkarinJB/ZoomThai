version: '3.8'

services:
  db:
    image: pgvector/pgvector:pg16
    container_name: zoomthai_db
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password
      POSTGRES_DB: zoomthai
    ports:
      - "5432:5432"
    volumes:
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d zoomthai"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: 
      context: .
      dockerfile: Dockerfile
    container_name: zoomthai_api
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=postgres://admin:password@db:5432/zoomthai
      - OPENAI_API_KEY=${OPENAI_API_KEY} 
    volumes:
      - ./extraction:/app/extraction
      - ./adapters:/app/adapters
      - ./api:/app/api
      - ./fixtures:/app/fixtures

volumes:
  pgdata: